<!--
  furrows.svg
  A tileable pattern. 80x80, repeats seamlessly, used at low
  opacity behind the dark bands so they are not flat colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <g stroke="#ffffff" stroke-opacity="0.055" stroke-width="1.5" fill="none">
    <path d="M-10 10 L 90 -90"/>
    <path d="M-10 50 L 90 -50"/>
    <path d="M-10 90 L 90 -10"/>
    <path d="M-10 130 L 90 30"/>
    <path d="M-10 170 L 90 70"/>
  </g>
</svg>
